<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI SYDNEY YOUTH</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Montserrat:wght@200;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cinematic Grain & Noise Overlay -->
    <div id="noise-overlay"></div>

    <!-- Custom Cursor -->
    <div id="cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-ring"></div>
    </div>

    <!-- Cinematic Navigation -->
    <nav class="cinematic-nav">
        <div class="nav-logo">CSI YOUTH</div>
        <div class="nav-links">
            <a href="#" class="interactive">HOME</a>
            <a href="#" class="interactive">VISION</a>
            <a href="#" class="interactive">GATHER</a>
        </div>
    </nav>

    <!-- Global Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Scroll Controlled Movie -->
    <main id="scroll-container">

        <!-- SCENE 01: THE VOID -->
        <section class="scene scene-void" id="scene-void">
            <div class="void-container">
                <div class="void-dot"></div>
                <div class="void-impact-ring"></div>
                <div class="void-light-burst"></div>
            </div>
        </section>

        <!-- SCENE 02: THE FIRST LIGHT -->
        <section class="scene scene-first-light" id="scene-first-light">
            <div class="layer bg-layer" style="background-image: url('https://images.unsplash.com/photo-1507281736509-c6289f1ea0f8?q=80&w=2560&auto=format&fit=crop');"></div>
            <div class="layer atmosphere-layer"></div>
            <div class="title-container">
                <h1 class="cinematic-title">
                    <span class="word">THE</span>
                    <span class="word accent-word">BEGINNING</span>
                </h1>
            </div>
        </section>

        <!-- SCENE 03 & 04: TYPOGRAPHY MORPH -->
        <section class="scene scene-text-morph" id="scene-text-morph">
            <div class="layer morph-bg" style="background-image: url('https://images.unsplash.com/photo-1470115636492-6d2b56f9146d?q=80&w=2560&auto=format&fit=crop');"></div>
            <div class="morph-text-container">
                <h2 class="morph-text">LET THERE BE LIGHT</h2>
            </div>
        </section>

        <!-- SCENE 05: THE HANDS (CLIMAX) -->
        <section class="scene scene-hands" id="scene-hands">
            <div class="hands-atmosphere"></div>
            
            <div class="hand-container hand-left">
                <!-- Using a dramatic hand reaching out -->
                <div class="hand-image" style="background-image: url('https://images.unsplash.com/photo-1614031413149-161b96a12db7?q=80&w=1200&auto=format&fit=crop'); transform: scaleX(-1);"></div>
            </div>
            
            <div class="hand-container hand-right">
                <div class="hand-image" style="background-image: url('https://images.unsplash.com/photo-1598194916694-8149eeb7fc39?q=80&w=1200&auto=format&fit=crop');"></div>
            </div>

            <div class="divine-contact-point"></div>
            <div class="white-transition"></div>
        </section>

        <!-- SCENE 06: COMMUNITY -->
        <section class="scene scene-community" id="scene-community">
            <div class="layer bg-layer community-bg" style="background-image: url('https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?q=80&w=2560&auto=format&fit=crop');"></div>
            <div class="layer warm-overlay"></div>
            <div class="community-text">
                <h3 class="stagger-text">WE</h3>
                <h3 class="stagger-text">ARE</h3>
                <h3 class="stagger-text">GATHERED</h3>
            </div>
        </section>

        <!-- SCENE 07: SYDNEY ATMOSPHERE -->
        <section class="scene scene-sydney" id="scene-sydney">
            <div class="layer bg-layer sydney-bg" style="background-image: url('https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?q=80&w=2560&auto=format&fit=crop');"></div>
            <div class="layer dark-gradient"></div>
        </section>

        <!-- SCENE 08: IDENTITY REVEAL -->
        <section class="scene scene-identity" id="scene-identity">
            <div class="identity-wrapper">
                <div class="id-small reveal-up">CSI</div>
                <div class="id-large reveal-up">SYDNEY</div>
                <div class="id-huge reveal-up">YOUTH</div>
            </div>
        </section>

        <!-- SCENE 09: INVITATION & OUTRO -->
        <section class="scene scene-outro" id="scene-outro">
            <div class="outro-content">
                <h2 class="invitation-text">COME AS YOU ARE.</h2>
                <a href="#" class="cinematic-btn interactive">
                    <span class="btn-text">MEET US</span>
                    <div class="btn-glow"></div>
                </a>
            </div>
            <footer class="minimal-footer">
                <p>GRACE • FAITH • HOPE</p>
                <p class="copyright">© 2026 CSI SYDNEY YOUTH</p>
            </footer>
        </section>

    </main>

    <!-- External Libraries -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
