<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE OPENING ACT | CSI SYDNEY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@200;300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="index.js" defer></script>
</head>
<body>
  <div id="custom-cursor" class="custom-cursor" aria-hidden="true">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
  </div>

  <div id="viewport-stage" class="viewport-stage">
    <canvas id="ambient-canvas" class="ambient-canvas"></canvas>
    <div id="screen-glare" class="screen-glare"></div>
    <div id="screen-vignette" class="screen-vignette"></div>

    <main id="cinematic-timeline" class="cinematic-timeline">

      <!-- WORLD 01: THE VOID / THE FALL / THE IMPACT -->
      <section id="world-01" class="cinematic-world world-void" data-world="1">
        <div class="world-container">
          <div id="void-atmosphere" class="atmosphere-layer">
            <div class="grain-overlay"></div>
            <div class="depth-fog depth-far"></div>
            <div class="depth-fog depth-near"></div>
          </div>

          <div id="dot-container" class="dot-container">
            <div id="luminous-dot" class="luminous-dot">
              <div class="dot-core"></div>
              <div class="dot-halo"></div>
              <div class="dot-bloom"></div>
              <div class="dot-distortion"></div>
              <div id="dot-light-trail" class="dot-light-trail"></div>
            </div>
          </div>

          <div id="impact-stage" class="impact-stage">
            <div class="impact-center"></div>
            <div class="shockwave shockwave-1"></div>
            <div class="shockwave shockwave-2"></div>
            <div class="shockwave shockwave-3"></div>
            <div class="light-burst"></div>
            <div class="secondary-flash"></div>
          </div>
        </div>
      </section>

      <!-- WORLD 02: THE LIGHT / HEAVENLY REVEAL -->
      <section id="world-02" class="cinematic-world world-heavenly" data-world="2">
        <div class="world-container">
          <div class="heaven-background-gradient"></div>

          <div class="environment-layer layer-sky" data-depth="0.1">
            <img class="cinema-img sky-img" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000" alt="Heavenly sky atmosphere" loading="eager" />
          </div>

          <div class="environment-layer layer-clouds-far" data-depth="0.2">
            <div class="procedural-cloud cloud-1"></div>
            <div class="procedural-cloud cloud-2"></div>
          </div>

          <div class="environment-layer layer-mountains" data-depth="0.35">
            <img class="cinema-img mountain-img" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000" alt="Celestial mountains silhouette" loading="eager" />
          </div>

          <div class="environment-layer layer-clouds-mid" data-depth="0.45">
            <div class="procedural-cloud cloud-3"></div>
          </div>

          <div class="environment-layer layer-sun-source" data-depth="0.5">
            <div class="divine-sun"></div>
            <div class="god-rays">
              <div class="ray ray-1"></div>
              <div class="ray ray-2"></div>
              <div class="ray ray-3"></div>
              <div class="ray ray-4"></div>
            </div>
          </div>

          <div class="environment-layer layer-subject" data-depth="0.65">
            <div id="christ-container" class="christ-container">
              <div class="artwork-frame">
                <img id="christ-artwork" class="cinema-img artwork-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Carl_Bloch_-_Resurrection.jpg/1024px-Carl_Bloch_-_Resurrection.jpg" alt="Resurrection artwork" loading="eager" />
                <div class="artwork-mask"></div>
                <div class="artwork-light-pass"></div>
              </div>

              <div class="artwork-frame secondary-artwork">
                <img id="creation-artwork" class="cinema-img artwork-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Michelangelo_-_Creation_of_Adam_%28cropped%29.jpg/1280px-Michelangelo_-_Creation_of_Adam_%28cropped%29.jpg" alt="Creation of Adam detail" loading="eager" />
              </div>
            </div>
          </div>

          <div class="environment-layer layer-clouds-near" data-depth="0.85">
            <div class="procedural-cloud cloud-foreground"></div>
          </div>

          <div class="environment-layer layer-haze" data-depth="1.0">
            <div class="sacred-mist"></div>
          </div>
        </div>
      </section>

      <!-- WORLD 03: PARTICLES & MASSIVE TYPOGRAPHIC WORLD -->
      <section id="world-03" class="cinematic-world world-typography" data-world="3">
        <div class="world-container">
          <canvas id="particle-canvas" class="particle-canvas"></canvas>

          <div id="typo-stage" class="typo-stage">
            <div class="typo-3d-wrapper">
              <div class="word-group word-faith">
                <span class="char" data-char="F">F</span>
                <span class="char" data-char="A">A</span>
                <span class="char" data-char="I">I</span>
                <span class="char" data-char="T">T</span>
                <span class="char" data-char="H">H</span>
              </div>

              <div class="word-group word-grace">
                <span class="char" data-char="G">G</span>
                <span class="char" data-char="R">R</span>
                <span class="char" data-char="A">A</span>
                <span class="char" data-char="C">C</span>
                <span class="char" data-char="E">E</span>
              </div>

              <div class="word-group word-light">
                <span class="char" data-char="L">L</span>
                <span class="char" data-char="I">I</span>
                <span class="char" data-char="G">G</span>
                <span class="char" data-char="H">H</span>
                <span class="char" data-char="T">T</span>
              </div>

              <div class="word-group word-jesus">
                <span class="char" data-char="J">J</span>
                <span class="char" data-char="E">E</span>
                <span class="char" data-char="S">S</span>
                <span class="char" data-char="U">U</span>
                <span class="char" data-char="S">S</span>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
